# Fork only: type-check and test every push to main (Node 22, like the upstream sync). omnibus-update.sh on
# the Unraid server refuses to deploy a commit whose run here failed.
name: Fork CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'  # same as the Docker image (node:26-slim)
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx vitest run
